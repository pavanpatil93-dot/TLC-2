name: TLC-2 Web MVP Validation

on:
  push:
    branches:
      - feature/tlc2-web-mvp
      - feature/tlc2-auto-batches-04-10
    paths:
      - 'web/**'
      - '.github/workflows/tlc2-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/tlc2-web.yml'

jobs:
  validate-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build production website
        run: npm run build
