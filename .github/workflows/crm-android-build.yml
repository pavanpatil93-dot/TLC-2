name: CRM Android Build Check

on:
  push:
    branches:
      - main
      - feature/tlc2-auto-batches-04-10
      - fix/persistence-integrity-20261111
      - fix/master-import-classification-20261111
      - fix/property-storage-fields-20261111
      - fix/sync-acknowledgements-20261111
      - feature/durable-sync-queue-20261111
      - feature/background-sync-retries-20261111
      - fix/background-sync-drain-limits-20261111
      - fix/call-opportunity-conversion-20261111
      - feature/tomorrow-mvp-property-search-20261111
      - feature/crm-foundation
      - feature/call-intelligence-architecture-20261111
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -60
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate CI-only debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=CI,C=US" -noprompt
      - name: Test and assemble Android debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable debug APK
        id: apk_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tlc-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Deliver APK through private draft release if artifact storage is full
        if: steps.apk_artifact.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          APK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          gh release create "apk-$APK_COMMIT" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --target "$APK_COMMIT" --draft --prerelease \
            --title "TLC-1 combined Android test APK" \
            --notes "Tests and Android assembly passed for commit $APK_COMMIT. Personal Samsung testing build. Shared team authentication and cross-phone confidential-access approvals remain incomplete. Back up installed app records before resolving any signing conflict."

